<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Quianna Thomas | Reset Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@600;700&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --noir:#0D0709;
      --pink:#EE2E96;
      --hot:#FF63BC;
      --deep:#A50E63;
      --cream:#FBF7F5;
      --muted:#756b70;
      --line:#e8dfe4;
      --success-bg:#e8f7ed;
      --success:#216e39;
      --error-bg:#fbe8ec;
      --error:#8c2336;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(238,46,150,.16),
          transparent 35%
        ),
        var(--cream);

      color:var(--noir);
      font-family:Inter,sans-serif;
    }

    .card {
      width:min(100%,460px);
      background:white;
      border:1px solid var(--line);
      border-radius:20px;
      padding:36px;

      box-shadow:
        0 20px 70px rgba(13,7,9,.12);

      text-align:center;
    }

    .logo {
      width:90px;
      height:90px;
      object-fit:cover;
      border-radius:50%;
      border:3px solid var(--pink);
      margin-bottom:18px;
    }

    .eyebrow {
      font:500 11px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:var(--deep);
      margin-bottom:10px;
    }

    h1 {
      font:600 32px "Playfair Display",serif;
      margin:0 0 8px;
    }

    .muted {
      color:var(--muted);
      line-height:1.6;
      font-size:14px;
    }

    form {
      margin-top:26px;
      text-align:left;
    }

    label {
      display:block;
      font:500 11px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:17px;
    }

    input {
      display:block;
      width:100%;
      margin-top:7px;
      padding:13px 14px;

      border:1px solid #d9cfd5;
      border-radius:10px;

      font:14px Inter,sans-serif;
      outline:none;
    }

    input:focus {
      border-color:var(--pink);

      box-shadow:
        0 0 0 3px rgba(238,46,150,.1);
    }

    button {
      width:100%;
      border:0;
      border-radius:999px;
      padding:14px;

      background:
        linear-gradient(
          135deg,
          var(--hot),
          var(--deep)
        );

      color:white;

      font:500 12px Oswald,sans-serif;

      text-transform:uppercase;
      letter-spacing:.08em;

      cursor:pointer;
    }

    button:disabled {
      opacity:.6;
      cursor:not-allowed;
    }

    .message {
      margin-top:14px;
      padding:12px;
      border-radius:10px;

      font-size:12px;
      line-height:1.5;
    }

    .error {
      background:var(--error-bg);
      color:var(--error);
    }

    .success {
      background:var(--success-bg);
      color:var(--success);
    }

    .back {
      display:inline-block;
      margin-top:22px;

      color:var(--deep);

      font:500 11px Oswald,sans-serif;

      text-transform:uppercase;
      letter-spacing:.08em;
      text-decoration:none;
    }

    .back:hover {
      color:var(--pink);
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      class="logo"
      src="1786871408756.jpg"
      alt="Quianna Thomas"
    >

    <div class="eyebrow">
      Client Account
    </div>

    <h1>
      Create a New Password
    </h1>

    <p class="muted">
      Enter a new password below to secure your account.
    </p>

    <form id="resetForm">

      <label>
        New Password

        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Enter new password"
          minlength="6"
          required
        >
      </label>

      <label>
        Confirm Password

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Confirm new password"
          minlength="6"
          required
        >
      </label>

      <button
        id="resetButton"
        type="submit"
      >
        Update Password
      </button>

      <div
        id="resetMessage"
        class="message error"
        hidden
      ></div>

    </form>

    <a
      class="back"
      href="login.html"
    >
      ← Back to Client Login
    </a>

  </main>

  <script>

    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://jvbuzplidgnebqxcucam.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ZzsHLYrq9Om_ue8UDLedYA_IMrpT2uF";


    const supabaseScript =
      document.createElement("script");

    supabaseScript.src =
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

    document.head.appendChild(
      supabaseScript
    );


    supabaseScript.onload =
      initializeResetPage;


    let supabaseClient = null;


    /* =====================================================
       INITIALIZE
       ===================================================== */

    function initializeResetPage() {

      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

      setupPasswordReset();

    }


    /* =====================================================
       PASSWORD RESET
       ===================================================== */

    function setupPasswordReset() {

      const form =
        document.getElementById(
          "resetForm"
        );

      const button =
        document.getElementById(
          "resetButton"
        );

      const message =
        document.getElementById(
          "resetMessage"
        );


      form.addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          message.hidden = true;


          const newPassword =
            document
              .getElementById(
                "newPassword"
              )
              .value;


          const confirmPassword =
            document
              .getElementById(
                "confirmPassword"
              )
              .value;


          /*
            CHECK PASSWORDS
          */

          if (
            newPassword !==
            confirmPassword
          ) {

            showMessage(
              "The passwords do not match.",
              "error"
            );

            return;
          }


          if (
            newPassword.length < 6
          ) {

            showMessage(
              "Your password must be at least 6 characters.",
              "error"
            );

            return;
          }


          button.disabled = true;

          button.textContent =
            "Updating Password...";


          /*
            UPDATE SUPABASE PASSWORD
          */

          const {
            error
          } =
            await supabaseClient.auth
              .updateUser({
                password:newPassword
              });


          if (error) {

            showMessage(
              "Unable to update your password: " +
              error.message,
              "error"
            );

            button.disabled = false;

            button.textContent =
              "Update Password";

            return;
          }


          /*
            SUCCESS
          */

          showMessage(
            "Your password has been updated successfully. You can now log in.",
            "success"
          );


          form.reset();


          button.disabled = false;

          button.textContent =
            "Password Updated";


          /*
            Give the client a moment
            to see the success message,
            then return to login.
          */

          setTimeout(
            function() {

              window.location.href =
                "login.html";

            },
            2500
          );

        }
      );

    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "resetMessage"
        );


      message.textContent =
        text;


      message.className =
        "message " +
        (
          type === "success"
            ? "success"
            : "error"
        );


      message.hidden = false;

    }

  </script>

</body>
</html>
