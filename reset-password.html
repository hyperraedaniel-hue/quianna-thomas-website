<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quianna Thomas | Reset Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@600;700&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --noir:#0D0709;
      --pink:#EE2E96;
      --hot:#FF63BC;
      --deep:#A50E63;
      --cream:#FBF7F5;
      --muted:#756b70;
      --line:#e8dfe4;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at 80% 10%, rgba(238,46,150,.16), transparent 35%),
        var(--cream);
      color:var(--noir);
      font-family:Inter,sans-serif;
    }

    .card {
      width:min(100%,460px);
      background:white;
      border:1px solid var(--line);
      border-radius:20px;
      padding:36px;
      box-shadow:0 20px 70px rgba(13,7,9,.12);
      text-align:center;
    }

    .logo {
      width:90px;
      height:90px;
      object-fit:cover;
      border-radius:50%;
      border:3px solid var(--pink);
      margin-bottom:18px;
    }

    .eyebrow {
      font:500 11px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:var(--deep);
      margin-bottom:10px;
    }

    h1 {
      font:600 32px "Playfair Display",serif;
      margin:0 0 8px;
    }

    .muted {
      color:var(--muted);
      line-height:1.6;
      font-size:14px;
    }

    form {
      margin-top:26px;
      text-align:left;
    }

    label {
      display:block;
      font:500 11px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:17px;
    }

    input {
      display:block;
      width:100%;
      margin-top:7px;
      padding:13px 14px;
      border:1px solid #d9cfd5;
      border-radius:10px;
      font:14px Inter,sans-serif;
      outline:none;
    }

    input:focus {
      border-color:var(--pink);
      box-shadow:0 0 0 3px rgba(238,46,150,.1);
    }

    button {
      width:100%;
      border:0;
      border-radius:999px;
      padding:14px;
      background:linear-gradient(135deg,var(--hot),var(--deep));
      color:white;
      font:500 12px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      cursor:pointer;
    }

    button:disabled {
      opacity:.6;
      cursor:not-allowed;
    }

    .message {
      margin-top:14px;
      padding:12px;
      border-radius:10px;
      font-size:12px;
      line-height:1.5;
    }

    .error {
      background:#fbe8ec;
      color:#8c2336;
    }

    .success {
      background:#e8f7ee;
      color:#176b3a;
    }

    .back {
      display:inline-block;
      margin-top:22px;
      color:var(--deep);
      font:500 11px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      text-decoration:none;
    }

    #loading {
      margin-top:20px;
      color:var(--muted);
      font-size:13px;
    }

    #resetForm {
      display:none;
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      class="logo"
      src="1786871408756.jpg"
      alt="Quianna Thomas">

    <div class="eyebrow">Client Account</div>

    <h1>Create a New Password</h1>

    <p class="muted">
      Enter a new password below to secure your account.
    </p>

    <div id="loading">
      Verifying your password reset link...
    </div>

    <form id="resetForm">

      <label>
        New Password
        <input
          id="newPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Enter new password"
          required>
      </label>

      <label>
        Confirm Password
        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Confirm new password"
          required>
      </label>

      <button id="updateButton" type="submit">
        Update Password
      </button>

      <div
        id="message"
        class="message"
        hidden>
      </div>

    </form>

    <a class="back" href="login.html">
      ← Back to Client Login
    </a>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://jvbuzplidgnebqxcucam.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ZzsHLYrq9Om_ue8UDLedYA_IMrpT2uF";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

    const loading =
      document.getElementById("loading");

    const form =
      document.getElementById("resetForm");

    const button =
      document.getElementById("updateButton");

    const message =
      document.getElementById("message");


    function showError(text) {

      message.textContent = text;
      message.className = "message error";
      message.hidden = false;

    }


    function showSuccess(text) {

      message.textContent = text;
      message.className = "message success";
      message.hidden = false;

    }


    async function prepareReset() {

      try {

        /*
          Some Supabase recovery links use a
          ?code=... parameter.

          If present, exchange it for a session.
        */

        const params =
          new URLSearchParams(
            window.location.search
          );

        const code =
          params.get("code");

        if (code) {

          const {
            error
          } =
            await supabaseClient.auth.exchangeCodeForSession(
              code
            );

          if (error) {

            console.error(
              "Code exchange error:",
              error
            );

            showError(
              "This password reset link has expired or is no longer valid. Please request a new reset link."
            );

            loading.style.display = "none";

            return;

          }

        }


        /*
          Supabase automatically processes
          recovery links containing access tokens
          in the URL.
        */

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "Session error:",
            error
          );

          showError(
            "We couldn't verify this password reset link."
          );

          loading.style.display = "none";

          return;

        }


        if (!data.session) {

          showError(
            "This password reset link is missing its secure session. Please open the newest password-reset email and tap the link again."
          );

          loading.style.display = "none";

          return;

        }


        /*
          We have a valid recovery session.
        */

        loading.style.display = "none";
        form.style.display = "block";

      }

      catch (err) {

        console.error(err);

        showError(
          "Something went wrong while verifying the reset link."
        );

        loading.style.display = "none";

      }

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        message.hidden = true;

        const newPassword =
          document
            .getElementById("newPassword")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        if (newPassword.length < 8) {

          showError(
            "Your password must be at least 8 characters."
          );

          return;

        }


        if (newPassword !== confirmPassword) {

          showError(
            "The passwords do not match."
          );

          return;

        }


        button.disabled = true;
        button.textContent =
          "Updating Password...";


        try {

          const {
            data: sessionData
          } =
            await supabaseClient.auth.getSession();


          if (!sessionData.session) {

            showError(
              "Your reset session has expired. Please open the newest password-reset email and try again."
            );

            button.disabled = false;
            button.textContent =
              "Update Password";

            return;

          }


          const {
            error
          } =
            await supabaseClient.auth.updateUser({
              password: newPassword
            });


          if (error) {

            console.error(
              "Password update error:",
              error
            );

            showError(
              "Unable to update your password: " +
              error.message
            );

            button.disabled = false;
            button.textContent =
              "Update Password";

            return;

          }


          showSuccess(
            "Password updated successfully! You can now log in with your new password."
          );

          button.textContent =
            "Password Updated";

          button.disabled = true;


          setTimeout(
            function() {

              window.location.href =
                "login.html";

            },
            2000
          );

        }

        catch (err) {

          console.error(err);

          showError(
            "Something went wrong. Please try again."
          );

          button.disabled = false;
          button.textContent =
            "Update Password";

        }

      }
    );


    /*
      Start the reset process.
    */

    prepareReset();

  </script>

</body>
</html>
