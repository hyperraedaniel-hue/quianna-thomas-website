<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Quianna Thomas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --noir:#0D0709;
      --pink:#EE2E96;
      --hot:#FF63BC;
      --deep:#A50E63;
      --cream:#FBF7F5;
      --muted:#756b70;
      --line:#e8dfe4;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at 80% 10%, rgba(238,46,150,.16), transparent 35%),
        var(--cream);
      color:var(--noir);
      font-family:Inter,sans-serif;
    }

    .card {
      width:min(100%,460px);
      background:white;
      border:1px solid var(--line);
      border-radius:20px;
      padding:36px;
      box-shadow:0 20px 70px rgba(13,7,9,.12);
      text-align:center;
    }

    h1 {
      font:600 32px "Playfair Display",serif;
      margin:0 0 10px;
    }

    p {
      color:var(--muted);
      line-height:1.6;
      font-size:14px;
    }

    form {
      margin-top:26px;
      text-align:left;
    }

    label {
      display:block;
      font:500 11px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:18px;
    }

    input {
      display:block;
      width:100%;
      margin-top:7px;
      padding:13px 14px;
      border:1px solid #d9cfd5;
      border-radius:10px;
      font:14px Inter,sans-serif;
      outline:none;
    }

    input:focus {
      border-color:var(--pink);
      box-shadow:0 0 0 3px rgba(238,46,150,.1);
    }

    button {
      width:100%;
      border:0;
      border-radius:999px;
      padding:14px;
      background:linear-gradient(135deg,var(--hot),var(--deep));
      color:white;
      font:500 12px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      cursor:pointer;
    }

    button:disabled {
      opacity:.6;
      cursor:not-allowed;
    }

    .message {
      margin-top:14px;
      padding:12px;
      border-radius:10px;
      font-size:12px;
      line-height:1.5;
    }

    .error {
      background:#fbe8ec;
      color:#8c2336;
    }

    .success {
      background:#e8f7ed;
      color:#216e39;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>Create New Password</h1>

    <p>
      Enter a new password for your owner account.
    </p>

    <form id="resetForm">

      <label>
        New Password
        <input
          id="newPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Enter new password"
          required>
      </label>

      <label>
        Confirm Password
        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Confirm new password"
          required>
      </label>

      <button id="resetButton" type="submit">
        Update Password
      </button>

      <div id="resetMessage" class="message" hidden></div>

    </form>

  </main>

  <script>
    const SUPABASE_URL =
      "https://jvbuzplidgnebqxcucam.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ZzsHLYrq9Om_ue8UDLedYA_IMrpT2uF";

    const supabaseScript =
      document.createElement("script");

    supabaseScript.src =
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

    document.head.appendChild(supabaseScript);

    supabaseScript.onload = async function() {

      const supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

      const form =
        document.getElementById("resetForm");

      const button =
        document.getElementById("resetButton");

      const message =
        document.getElementById("resetMessage");

      form.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.hidden = true;

        const newPassword =
          document.getElementById("newPassword").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {

          message.textContent =
            "The passwords do not match.";

          message.className =
            "message error";

          message.hidden = false;

          return;
        }

        if (newPassword.length < 8) {

          message.textContent =
            "Password must be at least 8 characters.";

          message.className =
            "message error";

          message.hidden = false;

          return;
        }

        button.disabled = true;
        button.textContent = "Updating...";

        const {
          error
        } =
          await supabaseClient.auth.updateUser({
            password: newPassword
          });

        if (error) {

          message.textContent =
            error.message;

          message.className =
            "message error";

          message.hidden = false;

          button.disabled = false;
          button.textContent = "Update Password";

          return;
        }

        message.textContent =
          "Password updated successfully. Redirecting to the owner login...";

        message.className =
          "message success";

        message.hidden = false;

        setTimeout(function() {

          window.location.href =
            "login.html";

        }, 2000);

      });

    };
  </script>

</body>
</html>
