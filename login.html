<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quianna Thomas | Client Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@600;700&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --noir:#0D0709;
      --pink:#EE2E96;
      --hot:#FF63BC;
      --deep:#A50E63;
      --cream:#FBF7F5;
      --muted:#756b70;
      --line:#e8dfe4;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(238,46,150,.16),
          transparent 35%
        ),
        var(--cream);

      color:var(--noir);
      font-family:Inter,sans-serif;
    }

    .card {
      width:min(100%,460px);
      background:white;
      border:1px solid var(--line);
      border-radius:20px;
      padding:36px;
      box-shadow:0 20px 70px rgba(13,7,9,.12);
      text-align:center;
    }

    .logo {
      width:90px;
      height:90px;
      object-fit:cover;
      border-radius:50%;
      border:3px solid var(--pink);
      margin-bottom:18px;
    }

    .eyebrow {
      font:500 11px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:var(--deep);
      margin-bottom:10px;
    }

    h1 {
      font:600 32px "Playfair Display",serif;
      margin:0 0 8px;
    }

    .muted {
      color:var(--muted);
      line-height:1.6;
      font-size:14px;
      margin-bottom:0;
    }

    form {
      margin-top:26px;
      text-align:left;
    }

    label {
      display:block;
      font:500 11px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:17px;
    }

    input {
      display:block;
      width:100%;
      margin-top:7px;
      padding:13px 14px;
      border:1px solid #d9cfd5;
      border-radius:10px;
      font:14px Inter,sans-serif;
      outline:none;
    }

    input:focus {
      border-color:var(--pink);
      box-shadow:0 0 0 3px rgba(238,46,150,.1);
    }

    button {
      width:100%;
      border:0;
      border-radius:999px;
      padding:14px;

      background:
        linear-gradient(
          135deg,
          var(--hot),
          var(--deep)
        );

      color:white;
      font:500 12px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      cursor:pointer;
    }

    button:disabled {
      opacity:.6;
      cursor:not-allowed;
    }

    .forgot {
      display:block;
      text-align:right;
      margin-top:-5px;
      margin-bottom:20px;

      color:var(--deep);
      font:500 11px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.06em;

      text-decoration:none;
    }

    .forgot:hover {
      color:var(--pink);
      text-decoration:underline;
    }

    .error {
      margin-top:14px;
      padding:12px;
      border-radius:10px;
      background:#fbe8ec;
      color:#8c2336;
      font-size:12px;
      line-height:1.5;
    }

    .success {
      margin-top:14px;
      padding:12px;
      border-radius:10px;
      background:#e8f7ee;
      color:#21663b;
      font-size:12px;
      line-height:1.5;
    }

    .back {
      display:inline-block;
      margin-top:22px;
      color:var(--deep);
      font:500 11px Oswald,sans-serif;
      text-transform:uppercase;
      letter-spacing:.08em;
      text-decoration:none;
    }

    .back:hover {
      color:var(--pink);
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      class="logo"
      src="1786871408756.jpg"
      alt="Quianna Thomas"
    >

    <div class="eyebrow">
      Client Portal
    </div>

    <h1>
      Welcome Back
    </h1>

    <p class="muted">
      Sign in to manage your appointments.
    </p>

    <form id="loginForm">

      <label>
        Email

        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="Email address"
          required
        >
      </label>

      <label>
        Password

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
        >
      </label>

      <!-- FORGOT PASSWORD -->

      <a
        href="reset-password.html"
        class="forgot"
      >
        Forgot Password?
      </a>

      <button
        id="loginButton"
        type="submit"
      >
        Sign In
      </button>

      <div
        id="loginError"
        class="error"
        hidden
      ></div>

      <div
        id="loginSuccess"
        class="success"
        hidden
      ></div>

    </form>

    <a
      class="back"
      href="index.html"
    >
      ← Back to Website
    </a>

  </main>

  <!-- SUPABASE -->

  <script>

    const SUPABASE_URL =
      "https://jvbuzplidgnebqxcucam.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ZzsHLYrq9Om_ue8UDLedYA_IMrpT2uF";

    const supabaseScript =
      document.createElement("script");

    supabaseScript.src =
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

    document.head.appendChild(supabaseScript);

    supabaseScript.onload = function() {

      const supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

      const form =
        document.getElementById("loginForm");

      const button =
        document.getElementById("loginButton");

      const errorBox =
        document.getElementById("loginError");

      const successBox =
        document.getElementById("loginSuccess");

      form.addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();

          errorBox.hidden = true;
          successBox.hidden = true;

          button.disabled = true;
          button.textContent =
            "Signing In...";

          const email =
            document
              .getElementById("email")
              .value
              .trim();

          const password =
            document
              .getElementById("password")
              .value;

          try {

            const {
              data,
              error
            } =
              await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
              });

            if (error) {

              errorBox.textContent =
                error.message ||
                "Invalid email or password.";

              errorBox.hidden = false;

              button.disabled = false;
              button.textContent = "Sign In";

              return;
            }

            if (data && data.session) {

              successBox.textContent =
                "Login successful. Opening your account...";

              successBox.hidden = false;

              setTimeout(function() {

                window.location.href =
                  "dashboard.html";

              }, 500);

            } else {

              errorBox.textContent =
                "Login could not be completed. Please try again.";

              errorBox.hidden = false;

              button.disabled = false;
              button.textContent = "Sign In";

            }

          } catch (err) {

            errorBox.textContent =
              "Unable to connect to the booking system. Please try again.";

            errorBox.hidden = false;

            button.disabled = false;
            button.textContent = "Sign In";

          }

        }
      );

    };

    supabaseScript.onerror = function() {

      const errorBox =
        document.getElementById("loginError");

      errorBox.textContent =
        "Unable to load the login system. Please check your internet connection and try again.";

      errorBox.hidden = false;

    };

  </script>

</body>
</html>
